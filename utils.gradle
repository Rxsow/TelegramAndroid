
def getVersionName = {
    // Tele iOS: CI builds append the GitHub run number so two actions builds can
    // never be confused by looking at the version in App info or the settings footer
    def runNumber = System.getenv("GITHUB_RUN_NUMBER")
    def suffix = runNumber != null ? "-" + runNumber : ""
    return APP_VERSION_NAME + "." + ADDITIONAL_BUILD_NUMBER + suffix
}

def getVersionCode = {
    return (APP_VERSION_CODE.toInteger() * 10 + ADDITIONAL_BUILD_NUMBER.toInteger()) + ""
}

def isFdroid = {
    return ((F_DROID.toInteger() == 1) as Boolean)
}

ext {
    Utils = [:]
    Utils['getVersionName'] = getVersionName
    Utils['getVersionCode'] = getVersionCode
    Utils['isFdroid'] = isFdroid
}
