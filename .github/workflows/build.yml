name: Build Forkgram iOS

on:
  workflow_dispatch:
  push:
    branches: [ dev, master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/build-tools /usr/local/lib/android/sdk/platforms || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Checkout source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm yasm golang gperf meson ninja-build pkg-config wget
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Rust toolchains with Android targets
        run: |
          set -e
          for RC in $(find TMessagesProj/jni -maxdepth 3 \( -name 'rust-toolchain.toml' -o -name 'rust-toolchain' \) 2>/dev/null); do
            TC=$(grep -m1 -E 'channel\s*=' "$RC" | cut -d'"' -f2)
            [ -z "$TC" ] && TC=$(head -n1 "$RC" | tr -d ' \r')
            [ -z "$TC" ] && continue
            echo "Found: $RC -> pinned toolchain: $TC"
            rustup toolchain install "$TC" --profile minimal --component rustfmt --component clippy
            rustup target add --toolchain "$TC" aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          done
          for t in $(rustup toolchain list | awk '{print $1}'); do
            rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android --toolchain "$t" 2>/dev/null || true
          done

      - name: Write Telegram API keys
        env:
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
        run: |
          if [ -n "$TG_APP_ID" ] && [ -n "$TG_APP_HASH" ]; then
            printf 'APP_ID=%s\nAPP_HASH=%s\n' "$TG_APP_ID" "$TG_APP_HASH" >> gradle.properties
          else
            echo "TG secrets not set - using APP_ID/APP_HASH already committed in gradle.properties"
          fi

      - name: Apply SF Pro fonts (iOS look)
        run: |
          F=TMessagesProj/src/main/assets/fonts
          if [ -d ios-fonts ]; then
            [ -f ios-fonts/SFProText-Medium.ttf ]   && cp ios-fonts/SFProText-Medium.ttf   $F/rmedium.ttf
            [ -f ios-fonts/SFProText-Bold.ttf ]     && cp ios-fonts/SFProText-Bold.ttf     $F/rextrabold.ttf
            [ -f ios-fonts/SFProText-Bold.ttf ]     && cp ios-fonts/SFProText-Bold.ttf     $F/mw_bold.ttf
            [ -f ios-fonts/SFProText-Semibold.ttf ] && cp ios-fonts/SFProText-Semibold.ttf $F/rcondensedbold.ttf
            echo "iOS fonts applied"; ls -la $F
          else
            echo "ios-fonts/ not found - default fonts"
          fi

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: TMessagesProj/jni/prebuild
          key: natives-v2-${{ github.sha }}
          restore-keys: natives-v2-

      - name: Build APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew assembleAfatRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apk_out
          find TMessagesProj TMessagesProj_App -name '*.apk' -path '*outputs*' -exec cp -v {} apk_out/ \; || true
          echo "--- collected files ---"
          ls -la apk_out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forkgram-iOS-APK
          path: apk_out/*.apk
          if-no-files-found: error
          compression-level: 0
